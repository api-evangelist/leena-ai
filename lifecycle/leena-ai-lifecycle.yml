summary: >-
  Leena AI versions its external APIs in the URL path and ships a monthly dated product
  newsletter as its changelog. Two of its three external APIs are explicitly labelled Beta.
  It publishes NO formal deprecation policy, NO Sunset/Deprecation header support, NO
  public SLA and NO public status page — the operational-maturity gaps in an otherwise
  well-documented platform.
