      service: aic (AOP execution)
    - version: v1
      path: /external/v1/audit-logs
      service: auditlogs
  consistency: >-
    Inconsistent — the version segment appears as `v1.0` on auth, `v1` under `/api/` on
    AOP, and `v1` under `/external/` on audit logs.
  breaking_change_policy_published: false
