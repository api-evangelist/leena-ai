openapi: 3.2.0
info:
  title: Leena AI Knowledge Management REST Connector Authentication…
  version: '1.0'
  description: 'Push knowledge base articles and their attachments from a source system into the Leena

    AI Knowledge Base, with per-article permission scoping, then trigger indexing once a

    bulk migration completes.'
  contact:
    name: Leena AI
    url: https://docs.leena.ai/
  x-generated: '2026-07-19'
  x-method: generated
  x-source: https://docs.leena.ai/docs/rest
servers:
- url: https://{host}
  description: Tenant/region host supplied by Leena AI. Leena AI's published host convention for its other external APIs is `https://<region-code>-<service>.leena.ai`, with the default region served unprefixed.
  variables:
    host:
      default: acl.leena.ai
      description: Host provided by your Leena AI representative.
tags:
- name: Authentication
  description: Obtain a bearer token.
paths:
  /api/v1.0/oauth/token:
    post:
      operationId: createKnowledgeAccessToken
      summary: Obtain an access token
      description: Exchanges client credentials plus a username and password for a bearer token. Documented token validity for the KM connector is 30 minutes by default; Leena AI recommends implementing token refresh logic in your middleware.
      tags:
      - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: A bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    TokenRequest:
      type: object
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
        username:
          type: string
        password:
          type: string
      required:
      - clientId
      - clientSecret
      - username
      - password
    Error:
      type: object
      properties:
        message:
          type: string
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Documented as 30 minutes by default for the KM connector.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token obtained from `createKnowledgeAccessToken`.
