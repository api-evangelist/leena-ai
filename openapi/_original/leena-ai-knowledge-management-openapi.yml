openapi: 3.0.3
info:
  title: Leena AI Knowledge Management REST Connector
  version: '1.0'
  description: |
    Push knowledge base articles and their attachments from a source system into the Leena
    AI Knowledge Base, with per-article permission scoping, then trigger indexing once a
    bulk migration completes.

    This specification was generated by the API Evangelist enrichment pipeline from Leena
    AI's published documentation. Leena AI does not publish a machine-readable OpenAPI
    definition.

    HOST CAVEAT: the KM connector guide documents paths and the OAuth token endpoint but
    does NOT publish the article-endpoint host — Leena AI states that a customer's
    `clientId`, `clientSecret`, `username`, `password` and endpoints are supplied by their
    Leena AI representative. The `host` server variable below is therefore left templated
    rather than guessed. The default reflects the unprefixed default-region auth host
    documented in the Audit Logs guide.
  contact:
    name: Leena AI
    url: https://docs.leena.ai/
  x-generated: '2026-07-19'
  x-method: generated
  x-source: https://docs.leena.ai/docs/rest
servers:
  - url: https://{host}
    description: >-
      Tenant/region host supplied by Leena AI. Leena AI's published host convention for its
      other external APIs is `https://<region-code>-<service>.leena.ai`, with the default
      region served unprefixed.
    variables:
      host:
        default: acl.leena.ai
        description: Host provided by your Leena AI representative.
tags:
  - name: Authentication
    description: Obtain a bearer token.
  - name: Knowledge Articles
    description: Stage attachments and sync articles into the Leena Knowledge Base.
paths:
  /api/v1.0/oauth/token:
    post:
      operationId: createKnowledgeAccessToken
      summary: Obtain an access token
      description: >-
        Exchanges client credentials plus a username and password for a bearer token.
        Documented token validity for the KM connector is 30 minutes by default; Leena AI
        recommends implementing token refresh logic in your middleware.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: A bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/integration/articles/upload/:
    post:
      operationId: uploadKnowledgeAttachment
      summary: Upload an attachment
      description: >-
        Stages a file and returns an `attachment_id` to reference from a subsequent article
        sync. Supported file types are PDF, DOC, DOCX, TXT, HTML, XLS, XLSX, PPT, PPTX, PNG
        and JPEG.
      tags:
        - Knowledge Articles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                mime_type:
                  type: string
              required:
                - file
      responses:
        '200':
          description: The attachment was staged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/integration/articles/sync/:
    post:
      operationId: syncKnowledgeArticle
      summary: Push a knowledge article
      description: >-
        Creates or updates an article in the Leena Knowledge Base, keyed by the source
        system's `reference_id`, with optional attachments and permission scoping.
      tags:
        - Knowledge Articles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleSyncRequest'
      responses:
        '200':
          description: The article was accepted.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid article payload, e.g. `html_content` that is not valid HTML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sync/complete/:
    post:
      operationId: completeKnowledgeSync
      summary: Complete the initial migration
      description: Signals the end of a bulk load and triggers indexing of the synced articles.
      tags:
        - Knowledge Articles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Indexing was triggered.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token obtained from `createKnowledgeAccessToken`.
  schemas:
    TokenRequest:
      type: object
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
        username:
          type: string
        password:
          type: string
      required:
        - clientId
        - clientSecret
        - username
        - password
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Documented as 30 minutes by default for the KM connector.
    AttachmentResponse:
      type: object
      properties:
        attachment_id:
          type: string
    ArticleSyncRequest:
      type: object
      properties:
        reference_id:
          type: string
          description: Stable identifier of the article in the source system.
        html_content:
          type: string
          description: Article body. Must be valid HTML.
        attachments:
          type: array
          description: Attachment identifiers returned by `uploadKnowledgeAttachment`.
          items:
            type: string
        permissions:
          $ref: '#/components/schemas/ArticlePermissions'
      required:
        - reference_id
        - html_content
    ArticlePermissions:
      type: object
      description: Visibility rules for the article.
      properties:
        department:
          type: array
          items:
            type: string
        location:
          type: array
          items:
            type: string
        user_groups:
          type: array
          items:
            type: string
    Error:
      type: object
      properties:
        message:
          type: string
