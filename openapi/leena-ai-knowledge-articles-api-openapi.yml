openapi: 3.2.0
info:
  title: Leena AI Knowledge Management REST Connector Knowledge…
  version: '1.0'
  description: 'Push knowledge base articles and their attachments from a source system into the Leena

    AI Knowledge Base, with per-article permission scoping, then trigger indexing once a

    bulk migration completes.'
  contact:
    name: Leena AI
    url: https://docs.leena.ai/
  x-generated: '2026-07-19'
  x-method: generated
  x-source: https://docs.leena.ai/docs/rest
servers:
- url: https://{host}
  description: Tenant/region host supplied by Leena AI. Leena AI's published host convention for its other external APIs is `https://<region-code>-<service>.leena.ai`, with the default region served unprefixed.
  variables:
    host:
      default: acl.leena.ai
      description: Host provided by your Leena AI representative.
tags:
- name: knowledge > articles
  description: Stage attachments and sync articles into the Leena Knowledge Base.
paths:
  /api/integration/articles/upload/:
    post:
      operationId: uploadKnowledgeAttachment
      summary: Upload an attachment
      description: Stages a file and returns an `attachment_id` to reference from a subsequent article sync. Supported file types are PDF, DOC, DOCX, TXT, HTML, XLS, XLSX, PPT, PPTX, PNG and JPEG.
      tags:
      - knowledge > articles
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                mime_type:
                  type: string
              required:
              - file
      responses:
        '200':
          description: The attachment was staged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/integration/articles/sync/:
    post:
      operationId: syncKnowledgeArticle
      summary: Push a knowledge article
      description: Creates or updates an article in the Leena Knowledge Base, keyed by the source system's `reference_id`, with optional attachments and permission scoping.
      tags:
      - knowledge > articles
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleSyncRequest'
      responses:
        '200':
          description: The article was accepted.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid article payload, e.g. `html_content` that is not valid HTML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sync/complete/:
    post:
      operationId: completeKnowledgeSync
      summary: Complete the initial migration
      description: Signals the end of a bulk load and triggers indexing of the synced articles.
      tags:
      - knowledge > articles
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Indexing was triggered.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ArticleSyncRequest:
      type: object
      properties:
        reference_id:
          type: string
          description: Stable identifier of the article in the source system.
        html_content:
          type: string
          description: Article body. Must be valid HTML.
        attachments:
          type: array
          description: Attachment identifiers returned by `uploadKnowledgeAttachment`.
          items:
            type: string
        permissions:
          $ref: '#/components/schemas/ArticlePermissions'
      required:
      - reference_id
      - html_content
    ArticlePermissions:
      type: object
      description: Visibility rules for the article.
      properties:
        department:
          type: array
          items:
            type: string
        location:
          type: array
          items:
            type: string
        user_groups:
          type: array
          items:
            type: string
    Error:
      type: object
      properties:
        message:
          type: string
    AttachmentResponse:
      type: object
      properties:
        attachment_id:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token obtained from `createKnowledgeAccessToken`.
