summary: >-
  Leena AI publishes no API client library for any language. The only first-party packages
  found on any public registry are two legacy NativeScript mobile-embed SDKs published in
  2022 under the @leena-ai npm scope — these embed the Leena virtual assistant in a mobile
  app, they are NOT clients for the External AOP, Audit Logs or Knowledge Management REST
  APIs. Integrators of those APIs are expected to call them directly over HTTP, or to reach
  the platform through MCP/A2A rather than through an SDK.
