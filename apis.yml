x-not-published:
  note: >-
    Recorded so re-runs do not re-probe. Each was searched or probed on 2026-07-19 and
    genuinely does not exist — no pointer is emitted for any of them.
  items:
    - what: OpenAPI / Swagger definition
      detail: >-
        No machine-readable spec published; /openapi.json, /openapi.yaml and /swagger.json
        return 404 on docs and API hosts. The files in openapi/ are generated from prose docs.
    - what: StatusPage
      detail: status.leena.ai does not resolve; no public status dashboard found.
    - what: Deprecation policy
      detail: No deprecation policy and no RFC 8594 Sunset/Deprecation header support.
    - what: SDKs
      detail: >-
        No API client library in any language. The two first-party @leena-ai npm packages are
        unmaintained 2022 NativeScript mobile-embed SDKs, not API clients, so no SDKs pointer
        is emitted — see packages/leena-ai-packages.yml.
    - what: Idempotency
      detail: >-
        No idempotency key on POST /api/v1/external/aop/execute or any other unsafe operation,
        so no Idempotency pointer is emitted.
    - what: AsyncAPI / Webhooks
      detail: >-
        No consumer-subscribable event surface. Documented webhook support is inbound
        connector configuration, not an event catalogue.
    - what: Pricing
      detail: No public pricing page (enterprise sales motion); /pricing returns 404.
    - what: SignUp
      detail: No public self-service signup for the platform or for API credentials.
    - what: Roadmap
      detail: No public roadmap found.
    - what: Postman
      detail: No public Postman collection or workspace found.
    - what: Sandbox
      detail: >-
        Staging and production environments are documented, but no public sandbox, test
        credentials or magic test values are published.
    - what: CLI
      detail: No first-party command line interface published.
    - what: Protobuf / gRPC
      detail: No .proto published on GitHub, buf.build or the docs.
