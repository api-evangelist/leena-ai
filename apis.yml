aid: leena-ai
name: Leena AI
description: >-
  Leena AI is an enterprise Agentic AI platform that deploys "AI Colleagues" — domain-specific,
  role-based autonomous agents — to automate back-office work across IT, HR, Finance,
  Procurement and Operations. Built on its proprietary WorkLM large language model, the platform
  pairs a no-code AI Colleagues Studio and Workflows Studio with Agent Operating Procedures
  (AOPs), guardrails, evals and approval paths. Its external developer surface is small but
  real: an OAuth 2.0 protected External AOP API for triggering and polling agent runs, an Audit
  Logs External API for compliance-grade activity export, a Knowledge Management REST connector
  for pushing knowledge base articles, and a first-party hosted MCP server plus an A2A endpoint
  that let third-party agents from Microsoft Copilot Studio, IBM watsonx Orchestrate, Salesforce
  Agentforce and ServiceNow call into Leena AI's agents. The platform is region-partitioned
  across eight named regions and carries SOC 2 Type 2, ISO/IEC 27001/27017/27018/27701, HIPAA
  and CSA STAR certifications.
